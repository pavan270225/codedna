name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-core:
    name: Core Tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd core
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          cd core
          python -m pytest tests/ -v --tb=short

      - name: Type check
        run: |
          cd core
          python -m mypy src/codedna --ignore-missing-imports

      - name: Lint
        run: |
          cd core
          python -m ruff check src/codedna tests/

  test-extension:
    name: Extension Tests (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: |
          cd extension
          npm ci

      - name: Compile
        run: |
          cd extension
          npm run compile

      - name: Lint
        run: |
          cd extension
          npm run lint

      - name: Package extension
        run: |
          cd extension
          npm run package

  build-dashboard:
    name: Build Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd dashboard/frontend
          npm ci

      - name: Build frontend
        run: |
          cd dashboard/frontend
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend
        run: |
          cd dashboard/backend
          pip install -e .

  ai-ratio-gate:
    name: AI Ratio Gate
    runs-on: ubuntu-latest
    needs: [test-core, test-extension]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install codedna
        run: |
          pip install -e .

      - name: Check AI ratio threshold
        run: |
          codedna scan . --format json | python3 -c "
import json, sys
data = json.load(sys.stdin)
total_ai = sum(len([a for a in f.get('attributions', []) if a['label'] in ['ai-generated', 'ai-modified']]) for f in data)
total_all = sum(len(f.get('attributions', [])) for f in data)
if total_all > 0:
    pct = (total_ai / total_all) * 100
    print(f'AI ratio: {pct:.1f}%')
    if pct > 30:
        print('::error::AI code exceeds 30% threshold')
        sys.exit(1)
else:
    print('No attribution data found')
"