[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codedna-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for CodeDNA dashboard"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "codedna @ file:///Users/pavanc/Projects/codedna",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "httpx>=0.26"]

[tool.uvicorn]
app = "main:app"
host = "0.0.0.0"
port = 8080
reload = true